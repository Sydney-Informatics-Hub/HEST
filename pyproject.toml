[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hest"
version = "1.1.2"
authors = [
  { name="Paul Doucet", email="homedoucetpaul@gmail.com" },
  { name="Guillaume Jaume", email="guillaume.jaume@unil.ch" },
]                            
dependencies = [
    "ultralytics >= 8.2.4",
    "pyvips >= 2.2.3",
    "scanpy >= 1.10.1",
    "imagecodecs >= 2024.1.1",
    "loguru >= 0.7.2",
    "timm >= 0.9.16",
    "transformers >= 4.40.2, < 5",
    "pytorch-lightning >= 2.2.4",
    "openslide-python >= 1.3.1",
    "einops",
    "einops-exts",
    "pyarrow >= 16.1.0",
    "spatialdata >= 0.6.1",
    "dask[complete] >= 2024.2.1",
    "spatial_image >= 1.2.3",
    "mygene",
    "trident @ git+https://github.com/mahmoodlab/TRIDENT.git"
]

requires-python = ">=3.11"

[tool.uv]
# Only resolve for the container target: Linux x86_64, Python 3.11.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
]

[tool.uv.sources]
cudf-cu12 = { index = "nvidia" }
dask-cudf-cu12 = { index = "nvidia" }
cucim-cu12 = { index = "nvidia" }
raft-dask-cu12 = { index = "nvidia" }
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

# Explicit indexes are only used for packages mapped to them in [tool.uv.sources].
[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[[tool.uv.index]]
# Ensures pytorch uses cu12 to match gpu deps
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.setuptools.packages.find]
# All the following settings are optional:
where = ["src"]

[project.optional-dependencies]
benchmark = [
    "trident[patch-encoders] @ git+https://github.com/mahmoodlab/TRIDENT.git",
]
docs = [
    "myst-nb",
    "sphinx-design",
    "sphinx-rtd-theme == 2.0.0",
    "furo",
]
# All CUDA 12 builds: RAPIDS from pypi.nvidia.com, torch from PyTorch's cu129 index.
# torch/torchvision are listed directly so [tool.uv.sources] applies to them.
gpu = [
    "cudf-cu12 == 26.10.*",
    "dask-cudf-cu12 == 26.10.*",
    "cucim-cu12 == 26.10.*",
    "raft-dask-cu12 == 26.10.*",
    "torch == 2.13.0",
    "torchvision == 0.28.0",
]
